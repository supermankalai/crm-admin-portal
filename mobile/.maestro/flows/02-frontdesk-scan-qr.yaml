# The front desk checks a member in from their live app QR code and sees a large green result.
# An emulator can't point a camera at another phone, so the flow fetches the member's live code
# from the API and enters it in the check-in search, which runs the same lookup and check-in as a
# camera scan (the code is single-use and expires after 45 s, so it's fetched at the last moment).
appId: com.kangagympilot.member.dev
name: Front desk scans a member's QR code
tags: [staff]
env:
  API_URL: http://localhost:3000
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: frontdesk1@irontemple.example
      PASSWORD: GymStaff#2026
- extendedWaitUntil:
    visible: "Scan with camera"
    timeout: 20000
- runScript:
    file: ../scripts/member-qr.js
    env:
      EMAIL: member1@irontemple.example
      PASSWORD: Member#2026
      GYM: iron-temple
- tapOn: "Or find by name or member number"
- inputText: ${output.qrToken}
- hideKeyboard
- tapOn: "Find"
- extendedWaitUntil:
    visible: "Can check in"
    timeout: 15000
- tapOn: "Check in"
- extendedWaitUntil:
    visible:
      id: "checkin-result"
    timeout: 15000
- assertVisible: "Allowed in"
# The same code can't be used twice (a screenshot of the QR is useless).
- tapOn:
    id: "checkin-result"
- tapOn: "Or find by name or member number"
- eraseText: 200
- inputText: ${output.qrToken}
- hideKeyboard
- tapOn: "Find"
- extendedWaitUntil:
    visible: ".*already used.*"
    timeout: 15000
