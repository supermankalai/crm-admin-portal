# Signs in from a clean install. Params: EMAIL, PASSWORD.
appId: com.kangagympilot.member.dev
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "login-identifier"
    timeout: 20000
- tapOn:
    id: "login-identifier"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
